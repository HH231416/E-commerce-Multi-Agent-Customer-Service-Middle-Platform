# 仅启动 Redis（最小依赖），应用直接 Python 运行
services:
  redis-stack:
    image: redis/redis-stack:latest
    container_name: cs-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--requirepass cs_redis_2024
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "cs_redis_2024", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
